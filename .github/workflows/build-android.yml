name: Build Android APK

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Permite que o GitHub Actions crie e atualize Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ==========================================
      # 2. Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ==========================================
      # 3. Instalar dependências
      # ==========================================
      - name: Install dependencies
        run: npm ci

      # ==========================================
      # 4. Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # ==========================================
      # 5. Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      # ==========================================
      # 6. Permissão do Gradle
      # ==========================================
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ==========================================
      # 7. Escolher o modo do app
      #    - Com CAPACITOR_SERVER_URL: APK abre o servidor Next.js real (HTTPS)
      #    - Sem a variável: APK de demonstração offline (sem servidor e sem banco)
      # ==========================================
      - name: Detect app mode
        id: mode
        env:
          CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL || secrets.CAPACITOR_SERVER_URL }}
        run: |
          if [ -n "$CAPACITOR_SERVER_URL" ]; then
            echo "mode=server" >> "$GITHUB_OUTPUT"
            echo "label=Servidor" >> "$GITHUB_OUTPUT"
            echo "artifact=ecoverify-debug" >> "$GITHUB_OUTPUT"
            echo "### 🌐 Modo servidor" >> "$GITHUB_STEP_SUMMARY"
            echo "O APK abre o servidor configurado em \`CAPACITOR_SERVER_URL\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=demo" >> "$GITHUB_OUTPUT"
            echo "label=Demo offline" >> "$GITHUB_OUTPUT"
            echo "artifact=ecoverify-demo-debug" >> "$GITHUB_OUTPUT"
            echo "### 🧪 Modo demonstração (offline)" >> "$GITHUB_STEP_SUMMARY"
            echo "\`CAPACITOR_SERVER_URL\` não está configurada: o APK inclui a demo offline (dados simulados no aparelho, sem servidor e sem banco)." >> "$GITHUB_STEP_SUMMARY"
            echo "Para gerar o APK conectado ao servidor real, crie a variável \`CAPACITOR_SERVER_URL\` (HTTPS) em Settings → Secrets and variables → Actions." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ==========================================
      # 8. Build da demo offline (somente no modo demo)
      # ==========================================
      - name: Build offline demo
        if: steps.mode.outputs.mode == 'demo'
        run: npm run demo:build

      # ==========================================
      # 9. Sincronizar Capacitor
      # ==========================================
      - name: Sync Capacitor
        run: npx cap sync android
        env:
          CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL || secrets.CAPACITOR_SERVER_URL }}

      # ==========================================
      # 10. Build do APK Debug
      # ==========================================
      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      # ==========================================
      # 11. Upload do APK como Artifact
      # ==========================================
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mode.outputs.artifact }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ==========================================
      # 12. Criar GitHub Release
      # ==========================================
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: EcoVerify Android APK v${{ github.run_number }} (${{ steps.mode.outputs.label }})

          body: |
            ## EcoVerify Android APK

            ### 📱 Debug APK · modo: ${{ steps.mode.outputs.label }}

            APK gerado automaticamente pelo GitHub Actions.

            ${{ steps.mode.outputs.mode == 'demo' && '> 🧪 **Versão de demonstração offline.** Funciona sem internet, sem servidor e sem banco de dados. Os dados são simulados e ficam salvos só no aparelho. Os perfis prontos (cidadão, moderador e admin) permitem testar o fluxo completo: enviar comprovação, moderar e ver os pontos no ranking. O saldo de FONE é simulado: nenhum FONE real é movimentado.' || '> 🌐 **Versão conectada ao servidor** configurado em `CAPACITOR_SERVER_URL`.' }}

            ### Instalação

            1. Baixe o arquivo `app-debug.apk`
            2. Transfira o APK para o dispositivo Android
            3. Permita a instalação de aplicativos desta fonte, se solicitado
            4. Abra o arquivo APK para instalar

            ### Observações

            - Esta é uma versão Debug para testes.
            - Esta versão não é destinada à distribuição pela Google Play Store.
            - Cada execução na branch `main` gera uma nova versão da Release.

          files: |
            android/app/build/outputs/apk/debug/app-debug.apk

          draft: false
          prerelease: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
