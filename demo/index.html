<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8f7" />
    <script>
      // Apply the saved theme before the first paint (no flash). Same storage key as src/store.ts.
      try {
        var s = JSON.parse(localStorage.getItem("ecoverify-demo") || "null");
        var u = s && s.users && s.users.find(function (x) { return x.id === s.currentUserId; });
        document.documentElement.dataset.theme = (u && u.theme) || "system";
      } catch (e) {
        document.documentElement.dataset.theme = "system";
      }
    </script>
    <meta name="format-detection" content="telephone=no" />
    <title>EcoVerify · Demo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
