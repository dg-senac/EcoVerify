<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8f7" />
    <script>
      // Apply the saved theme before the first paint (no flash). Same storage key as src/store.ts.
      try {
        var s = JSON.parse(localStorage.getItem("ecoverify-demo") || "null");
        var u = s && s.users && s.users.find(function (x) { return x.id === s.currentUserId; });
        document.documentElement.dataset.theme = (u && u.theme) || "system";
      } catch (e) {
        document.documentElement.dataset.theme = "system";
      }
    </script>
    <meta name="format-detection" content="telephone=no" />
    <title>EcoVerify · Sustainable actions rewarded in FONE</title>
    <meta name="description" content="Sustainable missions near you, verified by photo, GPS and AI, with rewards in FONE." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EcoVerify" />
    <!-- Link previews (WhatsApp, LinkedIn, Telegram…). %SITE_URL% is filled in at build time (see vite.config.mts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EcoVerify" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:title" content="EcoVerify · Sustainable actions rewarded in FONE" />
    <meta property="og:description" content="Missions near you, proof by photo + GPS + AI and transparent payouts on the Fone network." />
    <meta property="og:image" content="%SITE_URL%og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EcoVerify: sustainable actions, verified and rewarded in FONE" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
